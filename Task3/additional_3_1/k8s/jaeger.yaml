apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simplest
  namespace: observability
  labels:
    app: simplest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simplest
  template:
    metadata:
      labels:
        app: simplest
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.56
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: query
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: collector-http
              containerPort: 14268
            - name: collector-grpc
              containerPort: 14250
---
apiVersion: v1
kind: Service
metadata:
  name: simplest-query
  namespace: observability
spec:
  selector:
    app: simplest
  ports:
    - name: query
      port: 16686
      targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: simplest-collector
  namespace: observability
spec:
  selector:
    app: simplest
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
